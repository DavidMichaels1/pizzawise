<svg width="880" height="570" viewBox="0 0 880 570" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>PizzaWise system architecture</title>
  <desc>A browser talks over HTTPS to the web service, which talks over HTTPS with a JWT to the api service. The api service reads and writes PostgreSQL over Prisma on a private network, and calls the external Pizzeria API over HTTPS with an API key. Both the web and api services deploy automatically from GitHub on push. Web, api, and PostgreSQL are hosted on Railway; the Pizzeria API is a separate, externally hosted service.</desc>

  <rect x="0" y="0" width="880" height="570" fill="#ffffff" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3a3a3" />
    </marker>
  </defs>

  <!-- Railway hosting boundary -->
  <rect x="90" y="112" width="500" height="380" rx="16" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="6 5" />
  <text x="560" y="104" font-size="13" fill="#a3a3a3" text-anchor="end">Railway — this project's services</text>

  <!-- GitHub repo -->
  <rect x="40" y="30" width="190" height="56" rx="10" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.5" />
  <text x="135" y="54" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">GitHub repo</text>
  <text x="135" y="72" font-size="12" fill="#525252" text-anchor="middle">pizzawise, main branch</text>

  <!-- Browser -->
  <rect x="650" y="30" width="190" height="56" rx="10" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.5" />
  <text x="745" y="54" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Browser</text>
  <text x="745" y="72" font-size="12" fill="#525252" text-anchor="middle">customer's device</text>

  <!-- web -->
  <rect x="340" y="150" width="220" height="66" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" />
  <text x="450" y="177" font-size="14" font-weight="600" fill="#7c2d12" text-anchor="middle">web</text>
  <text x="450" y="196" font-size="12" fill="#9a3412" text-anchor="middle">React SPA + nginx</text>

  <!-- api -->
  <rect x="340" y="272" width="220" height="66" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" />
  <text x="450" y="299" font-size="14" font-weight="600" fill="#7c2d12" text-anchor="middle">api</text>
  <text x="450" y="318" font-size="12" fill="#9a3412" text-anchor="middle">Fastify + Prisma</text>

  <!-- Postgres -->
  <rect x="115" y="420" width="220" height="66" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="225" y="447" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">PostgreSQL</text>
  <text x="225" y="466" font-size="12" fill="#1d4ed8" text-anchor="middle">users, orders, favorites</text>

  <!-- Pizzeria API -->
  <rect x="560" y="420" width="230" height="66" rx="10" fill="#f5f5f5" stroke="#737373" stroke-width="1.5" />
  <text x="675" y="447" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Pizzeria API</text>
  <text x="675" y="466" font-size="12" fill="#525252" text-anchor="middle">external, ~110 pizzerias</text>

  <!-- GitHub -> web (deploy) -->
  <path d="M140,86 C140,120 340,120 400,150" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <!-- GitHub -> api (deploy) -->
  <path d="M150,86 C150,220 300,260 340,290" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" />
  <text x="240" y="95" font-size="12" fill="#a3a3a3">auto-deploy on push</text>

  <!-- Browser -> web -->
  <line x1="745" y1="86" x2="510" y2="150" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="700" y="115" font-size="12" fill="#404040" text-anchor="middle">HTTPS</text>

  <!-- web -> api -->
  <line x1="450" y1="216" x2="450" y2="272" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="530" y="248" font-size="12" fill="#404040" text-anchor="middle">HTTPS + JWT</text>

  <!-- api -> Postgres -->
  <line x1="400" y1="338" x2="240" y2="420" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="285" y="390" font-size="12" fill="#404040" text-anchor="middle">Prisma, private network</text>

  <!-- api -> Pizzeria API -->
  <line x1="500" y1="338" x2="655" y2="420" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="618" y="390" font-size="12" fill="#404040" text-anchor="middle">HTTPS + API key</text>

  <!-- Legend -->
  <rect x="150" y="518" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" />
  <text x="172" y="529" font-size="12" fill="#404040">this project's code</text>
  <rect x="360" y="518" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="382" y="529" font-size="12" fill="#404040">data store</text>
  <rect x="530" y="518" width="14" height="14" rx="3" fill="#f5f5f5" stroke="#737373" stroke-width="1.5" />
  <text x="552" y="529" font-size="12" fill="#404040">external service</text>
</svg>
